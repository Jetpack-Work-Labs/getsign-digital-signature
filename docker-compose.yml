networks:
  access-bridge:
    driver: bridge
  application-bridge:
    driver: bridge

services:
  getsign-app:
    container_name: getsign-app
    build:
      context: .
      target: dev
    restart: always
    mem_limit: 1536m
    networks:
      - application-bridge
      - access-bridge
    env_file:
      - path: .env
        required: false
    ports:
      - "9999:9999"
    volumes:
      - ./:/app
      # Keep the image's linux-built node_modules instead of the host's.
      - /app/node_modules
      # Keystores written by Node during enrollment, read back at signing time.
      - ./keystores:/keystores:rw
      - ./ca:/ca:rw
